<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arepa Express | Acceso Admin</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body class="login-page">

    <div class="login-box">

        <div class="login-logo">
            🫓
        </div>

        <span class="login-flag">
            🇻🇪 AREPA EXPRESS
        </span>

        <h1>Panel administrativo</h1>

        <p>
            Inicia sesión para administrar el menú.
        </p>


        <form id="loginForm">

            <label for="adminName">
                Nombre de administrador
            </label>

            <input
                type="text"
                id="adminName"
                placeholder="Nombre de admin"
                required
            >


            <label for="adminPassword">
                Contraseña
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Contraseña"
                required
            >


            <button type="submit">
                🔐 Entrar al panel
            </button>

            <div
                class="login-error"
                id="loginError"
            >
                Nombre o contraseña incorrectos.
            </div>

        </form>

    </div>


    <script src="login.js"></script>

</body>

</html>
